Syntax 6

# Card-specific UCM entry for iMac18,3: HDA Intel PCH with CS8409/CS42L83.
# Installed as conf.d/HDA-Intel/${CardLongName}.conf so it takes precedence
# over the generic HDA-Intel.conf fallback.
#
# The generic handler is skipped because it gates on "Master Playback Switch"
# and "Capture Switch", neither of which the CS8409 driver exposes on this
# machine. The CS8409 uses "Internal Mic Capture Switch" for capture control.

SectionUseCase."HiFi" {
	File "HDA Intel PCH at 0x92720000 irq 50/HiFi.conf"
	Comment "Play HiFi quality Music"
}

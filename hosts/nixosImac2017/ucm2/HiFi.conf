Syntax 6

# HiFi use case for iMac18,3 CS8409/CS42L83.
#
# The generic HDA UCM skips mic setup because it gates on "Capture Switch"
# which this driver doesn't expose. The CS8409 driver uses:
#   "Internal Mic Capture Switch"
#   "Internal Mic Capture Volume"
#   "Internal Mic Boost Volume"
#
# This config wires those up directly so WirePlumber sees a capture source.

SectionVerb {
	EnableSequence [
		cset "name='Internal Mic Capture Switch' on"
	]
	DisableSequence [
		cset "name='Internal Mic Capture Switch' off"
	]
	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speakers" {
	Comment "Built-in Speakers"
	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId}"
	}
}

SectionDevice."Mic1" {
	Comment "Internal Microphone"
	EnableSequence [
		cset "name='Internal Mic Capture Switch' on"
	]
	DisableSequence [
		cset "name='Internal Mic Capture Switch' off"
	]
	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId}"
		CaptureMixerElem "Internal Mic"
		CaptureVolume "Internal Mic Capture Volume"
		CaptureSwitch "Internal Mic Capture Switch"
	}
}
